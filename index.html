<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Reservas de Ski</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    <h1>Gestor de Reservas de Ski</h1>

    <form id="formReserva">
        <input type="text" id="nombre" placeholder="Nombre del cliente" required>
        <input type="date" id="fecha" required>

        <select id="nivel">
            <option value="Básico">Básico</option>
            <option value="Intermedio">Intermedio</option>
            <option value="Avanzado">Avanzado</option>
        </select>

        <select id="tipo">
            <option value="Ski">Ski</option>
            <option value="Snowboard">Snowboard</option>
        </select>

        <button type="submit">Crear reserva</button>
    </form>

    <h2>Reservas</h2>
    <div id="listaReservas"></div>

    <button id="vaciarBtn">Vaciar todas</button>

    <script src="js/logic/logic.js"></script>
    <script src="js/dom/app.js"></script>
</body>
</html>
